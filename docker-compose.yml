# Local services for development. Start with: docker compose up -d
#   PostgreSQL 16  localhost:5432   (databases hrportal and hrportal_test)
#   Redis 7        localhost:6379   (locks, queues and cache from phase 3)
#   MinIO          localhost:9000, console http://localhost:9001 (documents and payslips from phase 3)
#   Mailpit        inbox http://localhost:8025, SMTP localhost:1025 (catches every email the portal sends)
services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hrportal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hr"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    ports:
      - "6379:6379"
  storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gpp-local
      MINIO_ROOT_PASSWORD: gpp-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objects:/data
  mail:
    image: axllent/mailpit:v1.31.2
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  pgdata:
  objects:
