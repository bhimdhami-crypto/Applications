name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hrportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hr:hr@localhost:5432/hrportal_test
      DATABASE_URL: postgresql://hr:hr@localhost:5432/hrportal_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:test:setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  erp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: erp
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: 'Erp#Test2026'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Erp#Test2026' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: sqlserver://localhost:1433;database=mfierp_test;user=sa;password=Erp#Test2026;trustServerCertificate=true
      DATABASE_URL: sqlserver://localhost:1433;database=mfierp_test;user=sa;password=Erp#Test2026;trustServerCertificate=true
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp/package-lock.json
      - run: npm ci
      - name: Create test database
        working-directory: erp/api
        run: >-
          echo "IF DB_ID('mfierp_test') IS NULL CREATE DATABASE mfierp_test" |
          npx prisma db execute --stdin --url 'sqlserver://localhost:1433;database=master;user=sa;password=Erp#Test2026;trustServerCertificate=true'
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
