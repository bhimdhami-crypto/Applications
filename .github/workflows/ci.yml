name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hrportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hr:hr@localhost:5432/hrportal_test
      DATABASE_URL: postgresql://hr:hr@localhost:5432/hrportal_test
      JWT_SECRET: ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:test:setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
